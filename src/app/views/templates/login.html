<!doctype html>
<html lang="pt-BR" class="bg-zinc-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Sistema F1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --f1-bg: #15151e;
        --f1-text-highlight: #e43834;
      }
      .card {
        background-color: var(--f1-bg);
        border-radius: 1rem;
        padding: 1rem;
      }
    </style>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col">
    <nav class="bg-[--f1-bg]">
      <div class="mx-auto max-w-7xl px-4">
        <div class="flex h-16 items-center justify-center">
          <div class="flex gap-2 items-center">
            <div>
              <img
                src="/estatico/resources/icone-f1.png"
                class="size-20"
                alt="Logo F1"
              />
            </div>
            <h1 class="font-bold text-xl">Sistema de Gerenciamento F1</h1>
          </div>
        </div>
      </div>
    </nav>

    <main
      class="flex-grow mx-auto max-w-7xl py-16 px-4 w-full flex items-center justify-center"
    >
      <div class="card w-full max-w-md flex flex-col gap-6 p-8">
        <h2
          class="font-bold text-2xl text-center border-b border-zinc-800 pb-4"
        >
          Acesso ao Sistema
        </h2>

        <form
          id="form-login"
          class="flex flex-col gap-5"
          onsubmit="realizarLogin(event)"
        >
          <div class="flex flex-col gap-2">
            <label for="login" class="text-sm text-zinc-400 font-semibold"
              >Usuário</label
            >
            <input
              type="text"
              id="login"
              placeholder="Ex: admin, hamilton_d, mclaren_c"
              class="bg-zinc-800 p-3 rounded outline-none focus:ring-1 focus:ring-[--f1-text-highlight] transition"
              required
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="password" class="text-sm text-zinc-400 font-semibold"
              >Senha</label
            >
            <input
              type="password"
              id="password"
              placeholder="Digite sua senha"
              class="bg-zinc-800 p-3 rounded outline-none focus:ring-1 focus:ring-[--f1-text-highlight] transition"
              required
            />
          </div>

          <div
            id="mensagem-erro"
            class="text-[--f1-text-highlight] text-sm hidden font-bold text-center"
          ></div>

          <button
            type="submit"
            id="btn-submit"
            class="bg-[--f1-text-highlight] font-bold px-4 py-3 rounded hover:brightness-110 transition mt-2"
          >
            Entrar
          </button>
        </form>
      </div>
    </main>

    <footer class="border-t border-zinc-800 py-6">
      <div
        class="mx-auto max-w-7xl px-4 text-center text-zinc-500 sm:px-6 lg:px-8"
      >
        <p>Desenvolvido por:</p>
        <ul>
          <li>Cleverson Cristian Oliveira Sousa</li>
          <li>Vinicius Soares Martins</li>
          <li>Caio Delgado Pires</li>
        </ul>
      </div>
    </footer>

    <script>
      const API_BASE_URL = "http://localhost:3000";

      /* *
       * O evento "pageshow" abaixo foi implementado para corrigir um comportamento nativo do BFCache (Back/Forward Cache) dos navegadores.
       * Durante os testes, notamos que se o usuário fizesse login com sucesso e depois clicasse no botão "Voltar" do navegador,
       * a página de login era restaurada da memória RAM com o botão ainda desativado (disabled=true) e preso no estado "Verificando...".
       * A propriedade "event.persisted" detecta se a página foi carregada do cache e restaura o estado inicial da interface.
       */
      window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
          const btnSubmit = document.getElementById("btn-submit");
          btnSubmit.innerText = "Entrar";
          btnSubmit.disabled = false;
          document.getElementById("mensagem-erro").classList.add("hidden");
        }
      });

      async function realizarLogin(event) {
        event.preventDefault(); // Impede o envio tradicional do formulário (recarregamento da página)

        const loginInput = document.getElementById("login").value;
        const passwordInput = document.getElementById("password").value;
        const divErro = document.getElementById("mensagem-erro");
        const btnSubmit = document.getElementById("btn-submit");

        // Feedback visual e bloqueio de múltiplos cliques durante a requisição assíncrona
        divErro.classList.add("hidden");
        divErro.innerText = "";
        btnSubmit.innerText = "Verificando...";
        btnSubmit.disabled = true;

        try {
          const req = await fetch(`${API_BASE_URL}/api/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              login: loginInput,
              password: passwordInput,
            }),
            credentials: "include", // Propriedade essencial para permitir a troca do cookie HTTPOnly (JWT) com a API
          });

          const data = await req.json();

          if (req.ok) {
            // Restaura o botão antes de sair da página para garantir o estado correto caso o BFCache seja acionado
            btnSubmit.innerText = "Entrar";
            btnSubmit.disabled = false;

            // O cookie JWT já foi definido pelo backend, basta redirecionar para o dashboard
            window.location.href = "/dashboard";
          } else {
            // Exibe as mensagens de erro tratadas pela camada DAO (ex: credenciais inválidas)
            divErro.innerText = data.erro || "Credenciais inválidas.";
            divErro.classList.remove("hidden");
            btnSubmit.innerText = "Entrar";
            btnSubmit.disabled = false;
          }
        } catch (err) {
          divErro.innerText = "Erro na comunicação com a API.";
          divErro.classList.remove("hidden");
          btnSubmit.innerText = "Entrar";
          btnSubmit.disabled = false;
        }
      }
    </script>
  </body>
</html>
