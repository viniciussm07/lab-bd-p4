<!doctype html>
<html lang="pt-BR" class="bg-zinc-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard do Piloto | Sistema F1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --f1-bg: #15151e;
        --f1-text-highlight: #e43834;
      }
      .card {
        background-color: var(--f1-bg);
        border-radius: 1rem;
        padding: 1rem;
      }
    </style>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col">
    <nav class="bg-[--f1-bg]">
      <div class="mx-auto max-w-7xl px-4">
        <div class="flex h-16 items-center justify-between">
          <div class="flex gap-2 items-center">
            <div>
              <img src="/estatico/resources/icone-f1.png" class="size-20" />
            </div>
            <div class="flex">
              <a
                href="/dashboard"
                class="px-2 py-1 text-[--f1-text-highlight] font-bold"
                >Dashboard</a
              >
              <a href="/relatorios" class="px-2 py-1">Relatórios</a>
            </div>
          </div>
          <div class="flex items-center gap-4 text-right">
            <div>
              <p class="nome-piloto font-bold"></p>
              <p class="nome-escuderia text-sm text-zinc-300"></p>
            </div>
            <button
              onclick="realizarLogout()"
              class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold px-3 py-1.5 rounded transition"
            >
              Sair
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main
      class="flex-grow mx-auto max-w-7xl py-8 px-4 w-full flex flex-col gap-8"
    >
      <div class="grid grid-cols-2 gap-4">
        <div class="card">
          <p>Primeiro ano de corrida</p>
          <p class="data-primeiro-ano text-4xl font-bold">-</p>
        </div>
        <div class="card">
          <p>Último ano de corrida</p>
          <p class="data-ultimo-ano text-4xl font-bold">-</p>
        </div>
      </div>

      <div class="card overflow-x-auto">
        <table class="w-full border-separate border-spacing-x-2 metrics-table">
          <tr>
            <th class="text-left py-2 border-b border-zinc-800">Ano</th>
            <th class="text-left py-2 border-b border-zinc-800">Circuito</th>
            <th class="text-left py-2 border-b border-zinc-800">
              Qtd de pontos
            </th>
            <th class="text-left py-2 border-b border-zinc-800">Vitórias</th>
            <th class="text-left py-2 border-b border-zinc-800">
              Qtd total de corridas
            </th>
          </tr>
        </table>
      </div>
    </main>

    <footer class="border-t border-zinc-800 py-6">
      <div
        class="mx-auto max-w-7xl px-4 text-center text-zinc-500 sm:px-6 lg:px-8"
      >
        <p>Desenvolvido por:</p>
        <ul>
          <li>Cleverson Cristian Oliveira Sousa</li>
          <li>Vinicius Soares Martin</li>
          <li>Caio Delgado Pires</li>
        </ul>
      </div>
    </footer>

    <script>
      const API_BASE_URL = "http://localhost:3001";

      async function carregarDashboardPiloto() {
        try {
          const [reqStats, reqAnos, reqPerfil] = await Promise.all([
            fetch(`${API_BASE_URL}/api/piloto/estatisticas`, {
              credentials: "include",
            }),
            fetch(`${API_BASE_URL}/api/piloto/anos-atividade`, {
              credentials: "include",
            }),
            fetch(`${API_BASE_URL}/api/me`, { credentials: "include" }),
          ]);

          const estatisticas = await reqStats.json();
          const anos = await reqAnos.json();
          const perfil = await reqPerfil.json();

          document.querySelector(".nome-piloto").innerText =
            perfil.nome_piloto || "Piloto F1";
          document.querySelector(".nome-escuderia").innerText =
            perfil.nome_escuderia || "Equipe Atual";

          document.querySelector(".data-primeiro-ano").innerText =
            anos.primeiro_ano || "-";
          document.querySelector(".data-ultimo-ano").innerText =
            anos.ultimo_ano || "-";

          const tabela = document.querySelector(".metrics-table");

          if (Array.isArray(estatisticas) && estatisticas.length > 0) {
            estatisticas.forEach((stat) => {
              tabela.innerHTML += `
                <tr>
                  <td class="text-left py-3">${stat.ano}</td>
                  <td class="text-left py-3">${stat.circuito}</td>
                  <td class="text-left py-3">${stat.total_pontos}</td>
                  <td class="text-left py-3">${stat.total_vitorias}</td>
                  <td class="text-left py-3">${stat.total_corridas}</td>
                </tr>`;
            });
          } else {
            tabela.innerHTML += `<tr><td colspan="5" class="text-center text-zinc-500 py-4">Nenhuma métrica encontrada para este piloto.</td></tr>`;
          }
        } catch (err) {
          console.error("Deu ruim na request:", err);
        }
      }

      // encerra a sessao chamando a rota de auditoria do log
      async function realizarLogout() {
        try {
          const req = await fetch(`${API_BASE_URL}/api/logout`, {
            method: "POST",
            credentials: "include",
          });
          if (req.ok) {
            window.location.href = "/";
          }
        } catch (err) {
          console.error("Erro na requisicao de logout:", err);
        }
      }

      carregarDashboardPiloto();
    </script>
  </body>
</html>
